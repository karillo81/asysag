services:
  agent-backend:
    build: ./backend
    container_name: agent-backend
    env_file: .env
    environment:
      BACKEND_HOST: 0.0.0.0
    # The admin "restart" action exits the process; this policy relaunches it
    # with the new settings overlay (and recovers from crashes).
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./mock-data:/app/mock-data:ro
      - ./docs:/app/docs:ro
      - agent-state:/app/state

  agent-frontend:
    build: ./frontend
    container_name: agent-frontend
    depends_on:
      - agent-backend
    restart: unless-stopped
    ports:
      - "5173:80"

volumes:
  agent-state:
