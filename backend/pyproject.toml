[project]
name = "autosys-agent-backend"
version = "0.1.0"
description = "AutoSys Agent backend (FastAPI + LangGraph)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
agent = [
    "litellm>=1.50",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-litellm>=0.1",
]
rag = [
    "chromadb>=0.5",
]
ssh = [
    "paramiko>=3.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "adapters", "rag"]
